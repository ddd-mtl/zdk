[workspace]
resolver = "2"
members = [
  "zomes/agent_directory",
  "zomes/agent_directory_integrity",
  "zomes/path_explorer",
  "zomes/path_explorer_types",
  "zomes/profiles_alt_coordinator",
  "zomes/shared_ownership_integrity",
  "zomes/shared_ownership_coordinator",
  "zomes/zome_core",
  #"crates/sweettest_utils",
  "crates/time_indexing",
  "crates/zome_integrity_utils",
  "crates/zome_signals",
  "crates/zome_utils",
  "crates/zome_path",
]

[workspace.package]
edition = "2021"
rust-version = "1.75.0"
license = "CAL-1.0"

[workspace.lints.rust]
non_upper_case_globals = "allow"
unused_doc_comments = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
unused_attributes = "allow"

[workspace.dependencies]
serde = { version = "=1.0.219", default-features = false }
holochain_serialized_bytes = "=0.0.56"
hdi = { version = "=0.7.0-rc.0", default-features = false }
hdk = { version = "=0.6.0-rc.0", default-features = false }
holo_hash = { version = "0.6.0-rc.0", features = ["encoding", "serialization"], default-features = false }
#holochain = { version = "=0.6.0-rc.0", features = ["test_utils"] }

hc_zome_profiles_integrity = { git = "https://github.com/holochain-open-dev/profiles", branch = "main-0.6" }


[profile.dev]
lto = false
opt-level = 0
overflow-checks = false

[profile.release]
opt-level = "z"
lto = true

[profile.release.build-override]
opt-level = "z"
